name: Website checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openhisto_site/requirements-site.lock.txt
      - name: Install pinned website dependencies
        run: python -m pip install -r openhisto_site/requirements-site.lock.txt
      - name: Build committed website snapshots
        run: python openhisto_site/tools/site.py build
      - name: Check the published artifact
        run: python openhisto_site/tools/site.py check
      - name: Retain HTML for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: openhisto-website-html
          path: openhisto_site/_build/html/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Package the website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: openhisto_site/_build/html/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-check
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
